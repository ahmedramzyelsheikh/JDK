# DESIGN-FIRST example: the contract is written before the code, reviewed with the API consumers,
# then used to generate server interfaces and clients (openapi-generator) and to run contract tests.
openapi: 3.1.0
info:
  title: Library API
  version: 1.0.0
  description: Contract for the library service of topic 20.
servers:
  - url: http://localhost:8080
tags:
  - name: Books
paths:
  /api/books:
    get:
      tags: [Books]
      summary: Search books
      operationId: searchBooks
      parameters:
        - name: title
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookPage" }
    post:
      tags: [Books]
      summary: Add a book
      operationId: createBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookRequest" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/books/{id}:
    get:
      tags: [Books]
      summary: Get a book
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Error (RFC 9457 Problem Details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
  schemas:
    Book:
      type: object
      required: [id, title, isbn, price, author]
      properties:
        id: { type: integer, format: int64, readOnly: true, example: 1 }
        title: { type: string, example: Effective Java }
        isbn: { type: string, pattern: "^\\d{13}$", example: "9780134685991" }
        price: { type: number, example: 45.00 }
        publishedOn: { type: string, format: date, example: "2018-01-06" }
        author: { type: string, example: Joshua Bloch }
    CreateBookRequest:
      type: object
      required: [title, isbn, authorId, price]
      properties:
        title: { type: string, minLength: 1 }
        isbn: { type: string, pattern: "^\\d{13}$" }
        authorId: { type: integer, format: int64 }
        price: { type: number, exclusiveMinimum: 0 }
        publishedOn: { type: string, format: date }
    BookPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
