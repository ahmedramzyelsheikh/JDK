spring.application.name=inventory
# real deployments set these with env vars; tests get them from the Testcontainers @ServiceConnection
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory
spring.datasource.username=inventory
spring.datasource.password=${DB_PASSWORD:inventory}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
rates.base-url=https://api.exchange-rates.example
