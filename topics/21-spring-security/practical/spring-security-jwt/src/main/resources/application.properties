spring.application.name=spring-security-jwt
spring.threads.virtual.enabled=true

# HMAC key used to sign/verify tokens. At least 32 bytes for HS256.
# NEVER commit a real secret: in production inject it with the APP_JWT_SECRET environment variable
# (or use asymmetric RS256 keys / an external authorization server such as Keycloak).
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl=PT15M
app.jwt.issuer=jdk-course
app.cors.allowed-origins=http://localhost:3000
