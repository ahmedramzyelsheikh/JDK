spring.application.name=spring-boot-library

# ---- database (H2 in memory; for PostgreSQL see application-postgres.properties) ----
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

# ---- JPA: Flyway owns the schema, Hibernate only validates it ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# spring.jpa.show-sql=true

# ---- web ----
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# ---- our own type-safe configuration (LibraryProperties) ----
library.name=JDK Library
library.max-page-size=50

# ---- actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.description=Spring Boot practical of topic 20
