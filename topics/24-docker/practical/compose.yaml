# The inventory service of topic 23 + PostgreSQL + Adminer (DB web UI).
# From the repository root:
#   docker compose -f topics/24-docker/practical/compose.yaml up --build -d
#   curl localhost:8080/actuator/health
#   docker compose -f topics/24-docker/practical/compose.yaml down          (add -v to delete the data volume)
name: jdk-inventory

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}      # override via a .env file (never commit real secrets)
    volumes:
      - db-data:/var/lib/postgresql/data                 # named volume: data survives container re-creation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"                                      # only for local tools; the app uses the internal network

  app:
    build:
      context: ../../..                                  # repository root
      dockerfile: topics/24-docker/practical/Dockerfile
      args:
        MODULE: 23-integration-testing/practical/integration-tests-demo
    image: jdk/inventory:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/inventory    # "db" = service name = DNS name
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-inventory}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    depends_on:
      db:
        condition: service_healthy                       # wait until PostgreSQL accepts connections
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512m                                   # the JVM reads this limit (MaxRAMPercentage)
    restart: unless-stopped

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db-data:
