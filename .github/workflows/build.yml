name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  starter-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  topic-practicals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test Maven practicals
        run: ./mvnw -B -f topics/pom.xml verify
      - name: Run single-file practicals
        run: bash scripts/run-practicals.sh
